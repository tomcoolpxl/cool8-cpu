[package]
name = "cool8rs"
version = "0.1.0"
edition = "2021"
description = "COOL8 fast runner. Never authoritative: tools/cool8emu.py is the executable specification, and sim/rustsim.py holds this to its trace. See RUST_PORT.md."

[features]
# The window and the speaker. Off by default so the parity suite's
# build (sim/rustsim.py) stays dependency-free; tools/cool8rsrun.py
# builds with `--features gui`.
gui = ["dep:minifb", "dep:cpal", "dep:arboard"]

[dependencies]
minifb = { version = "0.27", optional = true }
cpal = { version = "0.15", optional = true }
arboard = { version = "3", optional = true, default-features = false }

[profile.release]
lto = true
codegen-units = 1
